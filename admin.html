<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextStay - Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            🏠 NextStay <span class="logo-badge" style="background: #fee2e2; color: #dc2626;">Admin Area</span>
        </a>
        <nav>
            <a href="index.html">← Back to Website</a>
        </nav>
    </header>

    <div class="auth-page-container">
        <div class="auth-card">
            <h1>🛡️ NextStay Admin</h1>
            <h2>Host & Portal Login</h2>
            <p class="auth-subtitle">Authorized administrator access to manage accommodations and visitor leads.</p>

            <form id="adminLoginForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="adminEmail">Admin Email</label>
                    <input type="email" id="adminEmail" class="form-input" placeholder="Enter admin email address" required>
                </div>

                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" class="form-input" placeholder="Enter admin password" required>
                </div>

                <button type="submit" id="adminLoginBtn" class="btn-primary" style="background: #1e293b;">
                    Login as Administrator
                </button>
            </form>

            <div style="margin-top: 25px;">
                <a href="index.html" class="back-link">← Return to Homepage</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="data-store.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const adminLoginBtn = document.getElementById("adminLoginBtn");

            // Form Submit - Strict Supabase Authentication
            document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
                e.preventDefault();

                const email = document.getElementById("adminEmail").value.trim();
                const password = document.getElementById("adminPassword").value;

                if (!email || !password) {
                    showToast("Please enter email and password.", "error");
                    return;
                }

                adminLoginBtn.disabled = true;
                adminLoginBtn.textContent = "Verifying Admin...";

                try {
                    if (!supabaseClient) {
                        showToast("Authentication service unavailable. Please check internet connection.", "error");
                        adminLoginBtn.disabled = false;
                        adminLoginBtn.textContent = "Login as Administrator";
                        return;
                    }

                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) {
                        showToast("Admin login failed: " + error.message, "error");
                        adminLoginBtn.disabled = false;
                        adminLoginBtn.textContent = "Login as Administrator";
                        return;
                    }

                    // Strict check: Only authorized Admin UID can access
                    if (!data?.user || data.user.id !== ADMIN_UID) {
                        await supabaseClient.auth.signOut();
                        DataStore.logout();
                        showToast("Access denied! This account does not have administrator privileges.", "error");
                        adminLoginBtn.disabled = false;
                        adminLoginBtn.textContent = "Login as Administrator";
                        return;
                    }

                    // Success - valid admin authenticated
                    const adminUser = {
                        id: data.user.id,
                        email: data.user.email,
                        name: "NextStay Administrator",
                        role: "admin"
                    };
                    DataStore.setCurrentUser(adminUser);
                    showToast("Admin verified! Redirecting to dashboard...", "success");
                    setTimeout(() => {
                        window.location.href = "admin-dashboard.html";
                    }, 800);

                } catch (err) {
                    showToast("Authentication error: " + (err.message || "Failed to authenticate"), "error");
                    adminLoginBtn.disabled = false;
                    adminLoginBtn.textContent = "Login as Administrator";
                }
            });
        });
    </script>

</body>
</html>
